import com.hypherionmc.modpublisher.properties.ReleaseType

plugins {
    id 'com.github.johnrengelman.shadow'
    id "com.hypherionmc.modutils.modpublisher" version "2.1.7"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

publisher {
    modrinthDepends {
        required "architectury-api"
    }
    curseDepends {
        required "architectury-api"
    }
    apiKeys {
        modrinth env.MODRINTH_TOKEN.value
        curseforge env.CURSE_TOKEN.value
    }

    setCurseID("1094179")
    setModrinthID("Ld2hGGKt")
    setVersionType("release")
    setChangelog("https://raw.githubusercontent.com/EltyDev/PrideTags/refs/heads/version/" + minecraft_version + "/changelog.md")
    setProjectVersion("${minecraft_version}-forge-${project.version}")
    setDisplayName("${minecraft_version} PrideTags - ${project.version} - Forge")
    setGameVersions(minecraft_version)
    setLoaders("forge")
    setCurseEnvironment("client")
    setIsManualRelease(true)
    setArtifact(remapJar)
    setJavaVersions(JavaVersion.current(), JavaVersion.current());
    setDisableEmptyJarCheck(true)
}
